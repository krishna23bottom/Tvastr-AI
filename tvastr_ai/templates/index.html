<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TVASTR AI | The Divine Craftsman of Visual Storytelling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0810; --panel:#15111d; --panel2:#1c1727; --line:#33283f;
  --gold:#e0a93e; --gold2:#f6d58a; --copper:#c8702a; --ember:#ff7a2f;
  --cream:#f4e8cb; --mute:#a39ab3;
  --serif:'Cinzel','Tiro Devanagari Sanskrit',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 70% -10%,#2a1710 0%,transparent 60%),radial-gradient(900px 600px at 0% 100%,#1a1030 0%,transparent 55%),var(--bg);
  color:var(--cream);font-family:system-ui,'Segoe UI',Roboto,sans-serif;overflow:hidden}
#embers{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;height:100vh;display:grid;grid-template-columns:270px 1fr}

/* ---------- sidebar: the workshop ---------- */
aside{border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(21,17,29,.92),rgba(12,9,18,.92));padding:22px 16px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center}
.brand svg{width:54px;height:54px;flex:none;animation:spin 40s linear infinite}
.brand h1{margin:0;font-family:var(--serif);font-size:21px;letter-spacing:3px;color:var(--gold2);line-height:1}
.brand h1 small{display:block;font-size:15px;letter-spacing:1px;color:var(--gold);margin-top:6px;font-weight:400}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5}
.lbl{font-family:var(--serif);font-size:11px;letter-spacing:3px;color:var(--mute);text-transform:uppercase}
.tools{display:flex;flex-direction:column;gap:7px}
.tool{display:flex;align-items:center;gap:11px;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--cream);padding:10px 12px;border-radius:10px;font-size:13.5px;cursor:pointer;transition:.2s}
.tool:hover{border-color:var(--gold);transform:translateX(3px);box-shadow:0 0 18px rgba(224,169,62,.15)}
.tool i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,var(--gold2),var(--copper));color:#2a1204;font-size:13px;flex:none}
.tool span em{display:block;font-style:normal;font-size:11px;color:var(--mute)}
.lore{font-size:12px;line-height:1.55;color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:11px;background:rgba(224,169,62,.04)}
.lore b{color:var(--gold)}
.newbtn{margin-top:auto;background:linear-gradient(135deg,var(--gold),var(--copper));color:#2a1204;border:none;border-radius:10px;padding:11px;font-family:var(--serif);font-weight:700;letter-spacing:1.5px;cursor:pointer;font-size:13px}
.newbtn:hover{filter:brightness(1.1)}

/* ---------- main ---------- */
main{display:flex;flex-direction:column;min-width:0;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;border-bottom:1px solid var(--line);background:rgba(10,8,16,.6);backdrop-filter:blur(6px)}
.top h2{margin:0;font-family:var(--serif);font-size:15px;letter-spacing:3px;color:var(--gold2);font-weight:500}
.top p{margin:3px 0 0;font-size:12px;color:var(--mute)}
.badge{font-size:11px;letter-spacing:1px;color:var(--gold);border:1px solid #5a4520;border-radius:20px;padding:4px 11px;display:flex;align-items:center;gap:7px}
.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ember);box-shadow:0 0 8px var(--ember);animation:pulse 1.8s infinite}
.menu{display:none;background:none;border:1px solid var(--line);color:var(--gold);border-radius:8px;padding:6px 10px;margin-right:10px;cursor:pointer}

#chat{flex:1;overflow-y:auto;padding:26px 28px;display:flex;flex-direction:column;gap:20px;position:relative}
#watermark{position:fixed;right:-150px;top:50%;width:700px;height:700px;transform:translateY(-50%);opacity:.3;pointer-events:none;filter:drop-shadow(0 0 24px rgba(255,150,50,.5))}
.cw{transform-origin:0 0;animation:spin 90s linear infinite}
.ccw{transform-origin:0 0;animation:spin 55s linear infinite reverse}
.aura{animation:pulse 4s ease-in-out infinite}
.row{display:flex;gap:12px;max-width:860px;width:100%;position:relative;z-index:1}
.row.user{align-self:flex-end;flex-direction:row-reverse}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:15px}
.row.bot .av{background:radial-gradient(circle at 30% 30%,var(--gold2),var(--copper));color:#2a1204;box-shadow:0 0 16px rgba(255,122,47,.35);font-family:var(--serif);font-weight:700}
.row.user .av{background:var(--panel2);border:1px solid var(--line);color:var(--gold)}
.bubble{padding:14px 17px;border-radius:14px;line-height:1.6;font-size:14.5px;word-wrap:break-word;min-width:0}
.row.bot .bubble{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-top-left-radius:3px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.row.user .bubble{background:linear-gradient(135deg,#3a2514,#2a1b12);border:1px solid #5a3a1e;border-top-right-radius:3px}
.bubble ul{margin:8px 0;padding-left:0;list-style:none}
.bubble li{position:relative;padding-left:22px;margin:7px 0}
.bubble li:before{content:"\2726";position:absolute;left:0;color:var(--gold);font-size:12px;top:3px}
.bubble b{color:var(--gold2)}
.seals{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:6px}
.seal{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--mute);letter-spacing:.3px}
.seal.i{color:var(--gold2);border-color:#6b5222;background:rgba(224,169,62,.08)}

.forge{display:flex;align-items:center;gap:10px;color:var(--mute);font-style:italic}
.hammer{display:inline-block;font-style:normal;transform-origin:80% 80%;animation:hit .7s ease-in-out infinite}

/* ---------- composer ---------- */
.starters{display:flex;gap:8px;padding:0 28px 10px;flex-wrap:wrap}
.starter{background:transparent;border:1px solid var(--line);color:var(--cream);padding:7px 13px;border-radius:20px;font-size:12.5px;cursor:pointer;transition:.2s}
.starter:hover{border-color:var(--gold);color:var(--gold2)}
form{display:flex;gap:10px;padding:6px 28px 24px}
.box{flex:1;display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 6px 0 16px;transition:.2s}
.box:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(224,169,62,.12),0 0 28px rgba(255,122,47,.12)}
input{flex:1;background:none;border:none;outline:none;color:var(--cream);font-size:14.5px;padding:15px 0}
input::placeholder{color:#6f6680}
#send{background:linear-gradient(135deg,var(--gold),var(--ember));color:#2a1204;border:none;border-radius:10px;width:46px;height:40px;font-size:18px;cursor:pointer;font-weight:700}
#send:disabled{opacity:.45;cursor:wait}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes hit{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row{animation:rise .35s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#3a2d4a;border-radius:8px}

@media(max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:270px;z-index:5;transform:translateX(-100%);transition:.25s}
  aside.open{transform:none}
  .menu{display:block}
  .top,#chat,form,.starters{padding-left:14px;padding-right:14px}
}
</style>
</head>
<body>
<canvas id="embers"></canvas>
<div class="app">
  <aside id="side">
    <div class="brand">
      <svg viewBox="-120 -120 240 240" data-chakra="brand"></svg>
      <h1>TVASTR<small>त्वष्टा</small></h1>
    </div>
    <div class="rule"></div>
    <div class="lbl">The Workshop</div>
    <div class="tools" id="tools"></div>
    <div class="lore"><b>Tvastr</b> is the divine craftsman of the Vedas, who shaped forms and forged Indra's thunderbolt. Here, he shapes your story.</div>
    <button class="newbtn" id="reset" type="button">BEGIN A NEW CREATION</button>
  </aside>

  <main>
    <div class="top">
      <div style="display:flex;align-items:center">
        <button class="menu" id="menu" type="button">&#9776;</button>
        <div><h2>THE DIVINE CRAFTSMAN</h2><p>Your AI co-pilot for visual storytelling</p></div>
      </div>
      <div class="badge" id="badge">FORGE LIT</div>
    </div>
    <div id="chat"><svg id="watermark" viewBox="-120 -120 240 240" data-chakra="wm"></svg></div>
    <div class="starters" id="starters"></div>
    <form id="form">
      <div class="box">
        <input id="msg" autocomplete="off" maxlength="1000" placeholder="Describe your scene, shoot or problem...">
        <button id="send" aria-label="Send">&#10148;</button>
      </div>
    </form>
  </main>
</div>

<script>
/* ---------- mandala (generated) ---------- */
document.querySelectorAll('.mandala').forEach(svg=>{
  let h='<g fill="none" stroke="#e0a93e" stroke-width="1.2">';
  h+='<circle r="96"/><circle r="88" stroke-dasharray="2 5"/><circle r="40"/><circle r="12" fill="#e0a93e" fill-opacity=".5"/>';
  for(let i=0;i<12;i++)h+=`<ellipse cx="0" cy="-62" rx="9" ry="24" transform="rotate(${i*30})"/>`;
  for(let i=0;i<12;i++)h+=`<ellipse cx="0" cy="-30" rx="5" ry="14" transform="rotate(${i*30+15})" stroke="#c8702a"/>`;
  for(let i=0;i<8;i++)h+=`<line x1="0" y1="-12" x2="0" y2="-40" transform="rotate(${i*45})" stroke="#f6d58a"/>`;
  svg.innerHTML=h+'</g>';
});


/* ---------- Sudarshana Chakra ---------- */
function drawChakra(svg,id){
  const P=(r,a)=>[(r*Math.sin(a*Math.PI/180)).toFixed(2),(-r*Math.cos(a*Math.PI/180)).toFixed(2)].join(',');
  const zig=(n,r0,r1,sweep)=>{let d='';for(let i=0;i<n;i++){const a=i*360/n,w=360/n;
    d+=(i?'L':'M')+P(r0,a)+'L'+P(r1,a+w*sweep)+'L'+P(r0,a+w);}return d+'Z'};
  let h=`<defs>
    <linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d58a"/><stop offset=".55" stop-color="#e0a93e"/><stop offset="1" stop-color="#c8702a"/></linearGradient>
    <radialGradient id="a${id}"><stop offset="0" stop-color="#ff9a3c" stop-opacity=".55"/><stop offset=".6" stop-color="#ff7a2f" stop-opacity=".12"/><stop offset="1" stop-color="#ff7a2f" stop-opacity="0"/></radialGradient>
  </defs>
  <circle class="aura" r="118" fill="url(#a${id})"/>
  <g class="cw" fill="url(#g${id})" fill-opacity=".16" stroke="url(#g${id})" stroke-width="1" stroke-linejoin="round">
    <path d="${zig(54,98,115,.62)}"/>
  </g>
  <g class="ccw" fill="none" stroke="url(#g${id})" stroke-width=".9" stroke-linejoin="round">
    <path d="${zig(36,84,95,.35)}" fill="url(#g${id})" fill-opacity=".1"/>
    <circle r="98" stroke-width="1.4"/><circle r="80" stroke-dasharray="1.5 4"/>`;
  for(let i=0;i<36;i++)h+=`<circle cx="${P(88,i*10).split(',')[0]}" cy="${P(88,i*10).split(',')[1]}" r="1.1" fill="#f6d58a" stroke="none"/>`;
  h+=`</g>
  <g class="cw" fill="none" stroke="url(#g${id})" stroke-width=".9">
    <circle r="70" stroke-width="1.3"/><circle r="64" stroke-dasharray="3 3"/>`;
  for(let i=0;i<24;i++)h+=`<line x1="${P(i%2?26:18,i*15).split(',')[0]}" y1="${P(i%2?26:18,i*15).split(',')[1]}" x2="${P(i%2?62:70,i*15).split(',')[0]}" y2="${P(i%2?62:70,i*15).split(',')[1]}" opacity="${i%2?.55:.95}"/>`;
  h+=`</g>
  <g class="ccw" fill="url(#g${id})" fill-opacity=".14" stroke="url(#g${id})" stroke-width="1" stroke-linejoin="round">`;
  for(let i=0;i<12;i++)h+=`<path d="M0,-24 C11,-36 11,-52 0,-66 C-11,-52 -11,-36 0,-24Z" transform="rotate(${i*30})"/>`;
  h+=`</g>
  <g fill="none" stroke="url(#g${id})" stroke-width="1.2"><circle r="22"/><circle r="15" stroke-dasharray="2 2"/></g>
  <g class="cw" fill="url(#g${id})">`;
  for(let i=0;i<8;i++)h+=`<path d="M0,-4 C3,-8 3,-12 0,-15 C-3,-12 -3,-8 0,-4Z" transform="rotate(${i*45})" fill-opacity=".9"/>`;
  h+=`</g><circle r="3.2" fill="#fff3c9"/><circle r="6" fill="none" stroke="#f6d58a" stroke-width=".8"/>`;
  svg.innerHTML=h;
}
document.querySelectorAll('svg[data-chakra]').forEach((s,i)=>drawChakra(s,i));

/* ---------- floating embers ---------- */
(function(){
  const c=document.getElementById('embers'),x=c.getContext('2d');let W,H,P=[];
  const size=()=>{W=c.width=innerWidth;H=c.height=innerHeight};size();addEventListener('resize',size);
  const mk=(fresh)=>({x:Math.random()*W,y:fresh?H+10:Math.random()*H,r:Math.random()*1.8+.4,v:Math.random()*.5+.2,d:Math.random()*Math.PI*2,a:Math.random()*.6+.2});
  for(let i=0;i<55;i++)P.push(mk(false));
  (function tick(){
    x.clearRect(0,0,W,H);
    for(const p of P){
      p.y-=p.v;p.d+=.01;p.x+=Math.sin(p.d)*.35;
      if(p.y<-10)Object.assign(p,mk(true));
      const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);
      g.addColorStop(0,`rgba(255,160,70,${p.a})`);g.addColorStop(1,'rgba(255,122,47,0)');
      x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r*4,0,6.283);x.fill();
    }
    requestAnimationFrame(tick);
  })();
})();

/* ---------- workshop tools (from the concept document) ---------- */
const TOOLS=[
 ["&#9776;","Shot List","Plan every frame","Help me create a shot list for my scene"],
 ["&#10070;","Moodboard","Find the visual identity","Suggest a mood and visual identity for my project"],
 ["&#9673;","Camera","Settings and lenses","What camera settings should I use for cinematic video?"],
 ["&#9788;","Lighting","Shape with light","How do I set up three point lighting?"],
 ["&#10047;","Color","Grade the mood","How do I get a cinematic color grade?"],
 ["&#9986;","Editing","Rhythm and cuts","How do I make my cuts feel smoother?"],
 ["&#9835;","Sound","Voice and ambience","How do I record clean dialogue?"]
];
const STARTERS=["I'm shooting a hip-hop music video at night with one artist, a parking lot and a car. Dark and aggressive.",
"My footage looks flat. How do I fix it?","How can I light an interview with one LED?","Best export settings for Instagram Reels?"];

const chat=document.getElementById('chat'),form=document.getElementById('form'),msg=document.getElementById('msg'),send=document.getElementById('send'),side=document.getElementById('side');
TOOLS.forEach(([ic,name,sub,q])=>{
  const b=document.createElement('button');b.type='button';b.className='tool';
  b.innerHTML=`<i>${ic}</i><span>${name}<em>${sub}</em></span>`;
  b.onclick=()=>{side.classList.remove('open');ask(q)};
  document.getElementById('tools').appendChild(b);
});
STARTERS.forEach(s=>{
  const b=document.createElement('button');b.type='button';b.className='starter';
  b.textContent=s.length>46?s.slice(0,44)+'...':s;b.onclick=()=>ask(s);
  document.getElementById('starters').appendChild(b);
});
document.getElementById('menu').onclick=()=>side.classList.toggle('open');

/* ---------- rendering ---------- */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function md(t){
  let h=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>').replace(/_\((.+?)\)_/g,'<i>($1)</i>');
  const out=[];let list=false;
  for(const line of h.split('\n')){
    const m=line.match(/^\s*(?:[-*\u2022]|\d+\.)\s+(.*)/);
    if(m){if(!list){out.push('<ul>');list=true}out.push('<li>'+m[1]+'</li>')}
    else{if(list){out.push('</ul>');list=false}out.push(line?line+'<br>':'<br>')}
  }
  if(list)out.push('</ul>');
  return out.join('').replace(/(<br>)+$/,'');
}
function add(cls,html){
  const r=document.createElement('div');r.className='row '+cls;
  r.innerHTML=`<div class="av">${cls==='bot'?'T':'&#9733;'}</div><div class="bubble">${html}</div>`;
  chat.appendChild(r);chat.scrollTop=chat.scrollHeight;return r;
}
function seals(r){
  const t=[];
  if(r.intent_label)t.push(`<span class="seal i">&#10022; ${esc(r.intent_label)} &middot; ${Math.round(r.confidence*100)}%</span>`);
  for(const v of Object.values(r.context||{}))for(const x of v)t.push(`<span class="seal">${esc(x.replace('_',' '))}</span>`);
  const src=r.source==='offline'?'built-in wisdom':r.source.replace('llm:','AI: ');
  t.push(`<span class="seal">${esc(src)}</span>`);
  return `<div class="seals">${t.join('')}</div>`;
}
async function ask(text){
  add('user',esc(text));msg.value='';send.disabled=true;
  const w=add('bot','<div class="forge"><span class="hammer">&#128296;</span> Tvastr is forging your answer...</div>');
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    const r=await res.json();w.remove();
    if(!res.ok)add('bot','The forge faltered: '+esc(r.error||'Something went wrong.'));
    else add('bot',md(r.reply)+seals(r));
  }catch(e){w.remove();add('bot','I cannot reach the forge. Make sure <b>python app.py</b> is still running.')}
  send.disabled=false;msg.focus();
}
form.addEventListener('submit',e=>{e.preventDefault();const t=msg.value.trim();if(t)ask(t)});
function greet(){add('bot',md("**Namaste.** I am **Tvastr**, the divine craftsman. Tell me about your project (type, mood, location, gear) and I will help you shape it, from the first idea to the final export."))}
document.getElementById('reset').onclick=async()=>{
  await fetch('/api/reset',{method:'POST'});
  chat.querySelectorAll('.row').forEach(n=>n.remove());greet();
};
fetch('/api/health').then(r=>r.json()).then(h=>{
  document.getElementById('badge').textContent=h.provider==='offline'?'FORGE LIT · OFFLINE':'FORGE LIT · '+h.provider.toUpperCase();
}).catch(()=>{});
greet();
</script>
</body>
</html>
